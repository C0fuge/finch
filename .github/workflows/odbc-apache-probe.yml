name: odbc-apache-probe
on: workflow_dispatch
jobs:
  probe:
    runs-on: ubuntu-24.04
    steps:
      - name: Look for the Apache Arrow Flight SQL ODBC driver packages
        run: |
          for u in https://apache.jfrog.io/artifactory/arrow/almalinux/9/x86_64/Packages/ \
                   https://apache.jfrog.io/artifactory/arrow/ubuntu/pool/noble/main/a/apache-arrow/ \
                   https://apache.jfrog.io/artifactory/arrow/ubuntu/pool/noble/main/a/apache-arrow-odbc/ \
                   https://apache.jfrog.io/artifactory/arrow/ ; do
            echo "== $u"
            curl -sS -m 60 "$u" > /tmp/l.html; wc -c /tmp/l.html
            grep -oiE 'href="[^"]*odbc[^"]*"' /tmp/l.html | sort -uV | tail -15 || true
          done
          echo "== downloads.apache.org/arrow/arrow-26.0.0/"
          curl -sS -m 60 https://downloads.apache.org/arrow/arrow-26.0.0/ | grep -oE 'href="[^"]*"' | head -30
