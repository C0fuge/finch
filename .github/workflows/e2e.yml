name: e2e
on:
  workflow_dispatch:
    inputs:
      clients:
        description: "space-separated clients to run (python_adbc python_adbc_zstd python_adbc_lz4 pyarrow_flight pyarrow_flight_zstd pyarrow_flight_lz4 java_flight java_flight_zstd java_flight_lz4 python_pandas python_polars python_duckdb python_sqlalchemy grafana grafana_gizmosql odbc metabase superset jdbc_meta duckdb_adbc_scanner)"
        default: "python_adbc"
      probe:
        description: "grafana/odbc/metabase/superset: run probes instead of TPC-H (any non-empty value)"
        default: ""
      s3_backend:
        description: "S3 backend (rclone|ceph|localstack|aws; aws needs repo secrets AWS_ACCESS_KEY_ID, AWS_SECRET_ACCESS_KEY, AWS_REGION, AWS_TEST_BUCKET)"
        default: "rclone"
      server_build:
        description: "server build (cadd1aca9c23|45fc0a9e6e02|775100bf923f|57d252b1437f|4d707e2aedfc|60e888bc26ec|20b887839edf|c3b276054cc3|4eaab052deaf|int7)"
        default: "cadd1aca9c23"
      metabase_tag:
        description: "metabase client: image tag"
        default: "v0.64.2.9"
      result_mode:
        description: "server result mode (partial|complete)"
        default: "complete"
  push:
    branches: [main]
    paths: ["e2e/**", ".github/workflows/e2e.yml"]
concurrency: e2e
jobs:
  e2e:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      CLIENTS: ${{ inputs.clients || 'python_adbc' }}
      RESULT_MODE: ${{ inputs.result_mode || 'complete' }}
      SERVER_BUILD: ${{ inputs.server_build || 'cadd1aca9c23' }}
      S3_BACKEND: ${{ inputs.s3_backend || 'rclone' }}
      AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
      AWS_REGION: ${{ secrets.AWS_REGION }}
      AWS_TEST_BUCKET: ${{ secrets.AWS_TEST_BUCKET }}
      WORK: ${{ github.workspace }}/work
      GH_TOKEN: ${{ github.token }}
      METABASE_TAG: ${{ inputs.metabase_tag || 'v0.64.2.9' }}
      GRAFANA_PROBE: ${{ inputs.probe || '' }}
    steps:
      - uses: actions/checkout@v4
      - name: Download e2e-assets
        run: |
          mkdir -p "$WORK/assets"
          gh release download e2e-assets --repo "$GITHUB_REPOSITORY" --dir "$WORK/assets"
          ls -l "$WORK/assets"
      - name: Start S3 and server
        env: { ASSETS: "${{ github.workspace }}/work/assets" }
        run: e2e/server.sh start
      - name: Run clients
        run: |
          set -uo pipefail
          . "$WORK/env.sh"
          python3 -m venv "$WORK/venv"; . "$WORK/venv/bin/activate"
          rc=0
          for c in $CLIENTS; do
            echo "::group::$c"
            case "$c" in
              python_adbc|python_adbc_zstd|python_adbc_lz4)
                pip install -q adbc-driver-flightsql pyarrow
                case "$c" in *_zstd) export FLIGHT_COMPRESSION=zstd;; *_lz4) export FLIGHT_COMPRESSION=lz4;; *) unset FLIGHT_COMPRESSION;; esac
                python e2e/clients/python_adbc.py e2e/queries "$WORK/out/$c"
                unset FLIGHT_COMPRESSION ;;
              pyarrow_flight|pyarrow_flight_zstd|pyarrow_flight_lz4)
                pip install -q pyarrow
                case "$c" in *_zstd) export FLIGHT_COMPRESSION=zstd;; *_lz4) export FLIGHT_COMPRESSION=lz4;; *) unset FLIGHT_COMPRESSION;; esac
                python e2e/clients/python_pyarrow_flight.py e2e/queries "$WORK/out/$c"
                docker logs flight1 2>&1 | grep -iE 'compress' | cut -c1-250 | sort | uniq -c | sort -rn | head -8 || true
                unset FLIGHT_COMPRESSION ;;
              java_flight|java_flight_zstd|java_flight_lz4)
                if [ ! -d "$WORK/jf/lib" ]; then
                  mvn -q -f e2e/java-flight/pom.xml dependency:copy-dependencies -DoutputDirectory="$WORK/jf/lib" -DincludeScope=runtime
                fi
                case "$c" in *_zstd) export FLIGHT_COMPRESSION=zstd;; *_lz4) export FLIGHT_COMPRESSION=lz4;; *) unset FLIGHT_COMPRESSION;; esac
                java --add-opens=java.base/java.nio=ALL-UNNAMED -cp "$WORK/jf/lib/*" e2e/java-flight/JavaFlight.java \
                  e2e/queries "$WORK/out/$c" flight1:32010
                unset FLIGHT_COMPRESSION ;;
              python_pandas|python_polars|python_duckdb)
                pip install -q adbc-driver-flightsql pyarrow pandas polars duckdb
                python e2e/clients/python_df.py "${c#python_}" e2e/queries "$WORK/out/$c" ;;
              python_sqlalchemy)
                pip install -q "sqlalchemy<2" flightsql-dbapi adbc-driver-flightsql pyarrow pandas
                python e2e/clients/python_df.py sqlalchemy e2e/queries "$WORK/out/$c"
                cat "$WORK/out/$c/reflection.txt" ;;
              grafana)
                docker run -d --name grafana --network afe2e -p 127.0.0.1:3000:3000 \
                  -e GF_INSTALL_PLUGINS=influxdata-flightsql-datasource grafana/grafana-oss:11.3.0 >/dev/null
                GRAFANA_PROBE=${GRAFANA_PROBE:-} python e2e/clients/grafana.py http://localhost:3000 flight1:32010 e2e/queries "$WORK/out/$c" \
                  || rc=1
                docker logs grafana 2>&1 | grep -iE 'panic|error|decimal|unsupported' | cut -c1-300 | sort | uniq -c | sort -rn | head -15 ;;
              grafana_gizmosql)
                mkdir -p "$WORK/gfplug" && chmod 777 "$WORK/gfplug"
                url=$(curl -sS https://api.github.com/repos/gizmodata/grafana-gizmosql-datasource/releases/latest \
                  | python3 -c 'import json,sys; r=json.load(sys.stdin); print(r["tag_name"], file=sys.stderr); print([a["browser_download_url"] for a in r["assets"] if a["name"].endswith(".zip")][0])')
                echo "plugin zip: $url"
                curl -sSL -o "$WORK/gf.zip" "$url" && unzip -q -o "$WORK/gf.zip" -d "$WORK/gfplug" && chmod -R a+rX "$WORK/gfplug"
                find "$WORK/gfplug" -maxdepth 2 | head -20
                docker run -d --name grafana_gizmosql --network afe2e -p 127.0.0.1:3000:3000 -v "$WORK/gfplug:/var/lib/grafana/plugins" \
                  -e GF_PLUGINS_ALLOW_LOADING_UNSIGNED_PLUGINS=gizmodata-gizmosql-datasource grafana/grafana-oss:11.3.0 >/dev/null
                GRAFANA_PLUGIN=gizmosql GRAFANA_PROBE=${GRAFANA_PROBE:-} python e2e/clients/grafana.py http://localhost:3000 flight1:32010 e2e/queries "$WORK/out/$c" \
                  || rc=1
                docker logs grafana_gizmosql 2>&1 | grep -iE 'panic|error|decimal|unsupported' | cut -c1-300 | sort | uniq -c | sort -rn | head -15
                docker rm -f grafana_gizmosql >/dev/null ;;
              odbc)
                unset ODBC_DRIVER LD_LIBRARY_PATH
                sudo apt-get install -qq -y unixodbc rpm2cpio cpio >/dev/null
                mkdir -p "$WORK/odbc" && curl -sSL -o "$WORK/odbc/d.rpm" \
                  https://download.dremio.com/arrow-flight-sql-odbc-driver/arrow-flight-sql-odbc-driver-LATEST.x86_64.rpm
                (cd "$WORK/odbc" && rpm2cpio d.rpm | cpio -idm 2>/dev/null)
                lib=$(ls "$WORK"/odbc/opt/arrow-flight-sql-odbc-driver/lib64/libarrow-odbc.so* | head -1)
                ldd "$lib" | grep -i 'not found' || true
                printf '[Arrow Flight SQL ODBC Driver]\nDriver=%s\n' "$lib" > "$WORK/odbc/odbcinst.ini"
                export ODBCSYSINI="$WORK/odbc" ODBCINSTINI=odbcinst.ini
                pip install -q pyodbc
                ODBC_PROBE=${GRAFANA_PROBE:-} python e2e/clients/odbc.py e2e/queries "$WORK/out/$c" \
                  || { rc=1; continue; } ;;
              odbc_apache)
                sudo apt-get install -qq -y unixodbc rpm2cpio cpio >/dev/null
                mkdir -p "$WORK/odbca" && curl -sSL -o "$WORK/odbca/d.rpm" \
                  https://apache.jfrog.io/artifactory/arrow/almalinux/9/x86_64/Packages/arrow2600-flight-sql-odbc-libs-26.0.0-1.el9.x86_64.rpm
                (cd "$WORK/odbca" && rpm2cpio d.rpm | cpio -idm 2>/dev/null; find . -type f | head -30)
                lib=$(find "$WORK/odbca" -name '*odbc*.so*' -type f | head -1)
                for p in liburiparser1 libre2-10 $(apt-cache search --names-only '^libutf8proc[0-9]' | awk '{print $1}'); do
                  sudo apt-get install -qq -y "$p" >/dev/null || echo "apt failed: $p"
                done
                mkdir -p "$WORK/odbca/deps"
                ln -sf "$(ldconfig -p | awk '/libre2\.so\.10 /{print $NF; exit}')" "$WORK/odbca/deps/libre2.so.9"
                u=$(ldconfig -p | awk '/libutf8proc\.so\.[0-9]+ /{print $NF; exit}'); echo "utf8proc=$u"
                [ -n "$u" ] && ln -sf "$u" "$WORK/odbca/deps/libutf8proc.so.2"
                export LD_LIBRARY_PATH="$WORK/odbca/deps${LD_LIBRARY_PATH:+:$LD_LIBRARY_PATH}"
                echo "lib=$lib"; ldd "$lib" | grep -i 'not found' || true
                printf '[Apache Arrow Flight SQL ODBC Driver]\nDriver=%s\n' "$lib" > "$WORK/odbca/odbcinst.ini"
                export ODBCSYSINI="$WORK/odbca" ODBCINSTINI=odbcinst.ini ODBC_DRIVER="Apache Arrow Flight SQL ODBC Driver"
                pip install -q pyodbc
                ODBC_PROBE=${GRAFANA_PROBE:-} python e2e/clients/odbc.py e2e/queries "$WORK/out/$c" \
                  || { rc=1; continue; } ;;
              metabase)
                mkdir -p "$WORK/mb/plugins"
                curl -sSL -o "$WORK/mb/plugins/arrow-flight-sql.metabase-driver.jar" \
                  https://github.com/J0hnG4lt/metabase-flightsql-driver/releases/latest/download/arrow-flight-sql.metabase-driver.jar
                chmod -R a+rwX "$WORK/mb/plugins"; chmod a+rwx "$WORK/mb/plugins"; ls -l "$WORK/mb/plugins"
                (cd "$WORK/mb" && unzip -l plugins/*.jar | grep -vE '/$' | awk '{print $4}' | grep -vE '^(org|io|com|javax|META-INF/(maven|services))/' | head -40 || true
                 unzip -p plugins/*.jar metabase-plugin.yaml | head -40 || true)
                docker run -d --name metabase --network afe2e -p 127.0.0.1:3001:3000 -v "$WORK/mb/plugins:/plugins" \
                  -e JAVA_OPTS="--add-opens=java.base/java.nio=ALL-UNNAMED --add-opens=java.base/sun.nio.ch=ALL-UNNAMED --sun-misc-unsafe-memory-access=allow --enable-native-access=ALL-UNNAMED -Dio.netty.tryReflectionSetAccessible=true" \
                  metabase/metabase:${METABASE_TAG:-v0.64.2.9} >/dev/null
                METABASE_PROBE=${GRAFANA_PROBE:-} python e2e/clients/metabase.py http://localhost:3001 flight1:32010 e2e/queries "$WORK/out/$c" \
                  || rc=1
                docker logs metabase 2>&1 | grep -iE 'flight|exception|error' | cut -c1-300 | sort | uniq -c | sort -rn | head -15
                [ -n "${GRAFANA_PROBE:-}" ] && continue ;;
              superset)
                docker build -q -t finch-superset -f e2e/superset/Dockerfile e2e/superset
                docker run -d --name superset --network afe2e -p 127.0.0.1:8088:8088 \
                  -v "$WORK/../e2e/superset/superset_config.py:/app/pythonpath/superset_config.py:ro" \
                  -e SUPERSET_CONFIG_PATH=/app/pythonpath/superset_config.py finch-superset \
                  bash -c "superset db upgrade && superset fab create-admin --username admin --firstname a --lastname b --email a@example.com --password admin && superset init && gunicorn -w 2 -t 900 -b 0.0.0.0:8088 'superset.app:create_app()'" >/dev/null
                if [ -n "${GRAFANA_PROBE:-}" ]; then
                  for i in $(seq 100); do curl -sf localhost:8088/health >/dev/null && break; sleep 3; done
                  docker exec -i -e U="gizmosql://superset:$FLIGHT_TOKEN@flight1:32010" superset /app/.venv/bin/python - < e2e/superset/diag.py 2>&1 \
                    | sed "s/$FLIGHT_TOKEN/***/g" | tail -40
                fi
                SUPERSET_PROBE=${GRAFANA_PROBE:-} python e2e/clients/superset.py http://localhost:8088 flight1:32010 e2e/queries "$WORK/out/$c" \
                  || rc=1
                docker logs superset 2>&1 | grep -iE 'flight|exception|error' | cut -c1-300 | sort | uniq -c | sort -rn | head -15
                [ -n "${GRAFANA_PROBE:-}" ] && continue ;;
              jdbc_meta)
                mkdir -p "$WORK/jdbc" "$WORK/out/$c"
                curl -sSL -o "$WORK/jdbc/driver.jar" \
                  https://repo1.maven.org/maven2/org/apache/arrow/flight-sql-jdbc-driver/18.3.0/flight-sql-jdbc-driver-18.3.0.jar
                java --add-opens=java.base/java.nio=ALL-UNNAMED -cp "$WORK/jdbc/driver.jar" e2e/jdbc/MetaConformance.java \
                  flight1:32010 "$WORK/out/$c/report.txt" || rc=1
                continue ;;
              clickhouse_probe)
                . "$WORK/env.sh"
                docker pull -q clickhouse/clickhouse-server:latest >/dev/null
                docker run --rm clickhouse/clickhouse-server:latest clickhouse-local --version
                for q in "SELECT * FROM arrowFlight('flight1:32010', 'tpch.region')" \
                         "SELECT * FROM arrowFlight('flight1:32010', 'SELECT * FROM tpch.region')" \
                         "SELECT * FROM arrowFlight('flight1:32010', 'tpch.region', 'user', '$FLIGHT_TOKEN')"; do
                  echo "--- ${q//$FLIGHT_TOKEN/***}"
                  docker run --rm --network afe2e clickhouse/clickhouse-server:latest clickhouse-local -q "$q" 2>&1 \
                    | sed "s/$FLIGHT_TOKEN/***/g" | cut -c1-600 | head -20 || true
                done
                docker logs flight1 2>&1 | grep -iE 'exception|error|unsupported|descriptor' | cut -c1-400 | tail -15 || true
                continue ;;
              duckdb_adbc_scanner)
                pip install -q adbc-driver-flightsql pyarrow "duckdb<2"
                python e2e/clients/duckdb_adbc_scanner.py e2e/queries "$WORK/out/$c" ;;
              duckdb_airport)
                pip install -q "duckdb<2"
                python e2e/clients/duckdb_airport.py; continue ;;
              *) echo "unknown client $c"; rc=1; continue ;;
            esac
            python e2e/compare.py e2e/reference/sf1 "$WORK/out/$c" e2e/queries "$WORK/out/$c-summary.tsv" || rc=1
            echo "::endgroup::"
          done
          exit $rc
      - name: Stop
        if: always()
        run: e2e/server.sh stop
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: e2e-results
          path: |
            work/out
            work/flight1.log
